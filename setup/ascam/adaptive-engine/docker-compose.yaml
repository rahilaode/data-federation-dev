version: '3.8'

services:
  adaptive-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ascam-adaptive-engine
    restart: unless-stopped
    networks:
      - ascam-networks
    volumes:
      # Artefak OBDA: mapping (ℳ) dan ontologi (𝒯)
      - ../../vkg-system/config:/opt/ontop/input

      # Artefak federasi: folder deployment scanner Teiid (Σ_S + marker file).
      # HARUS folder yang sama dengan yang di-mount ke kontainer Teiid.
      - ../../data-federation/deployments:/opt/teiid/deployments

      # State ASCAM: snapshot artefak dan log adaptasi (metrik)
      - ./state:/app/state

      # Docker socket untuk reload Ontop
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      PYTHONUNBUFFERED: "1"
      ONTOP_CONTAINER_NAME: vkg-system-ontop-teiid
      TEIID_CONTAINER_NAME: data-federation-teiid
      VDB_PATH: /opt/teiid/deployments/government-vdb.xml

networks:
  ascam-networks:
    external: true
