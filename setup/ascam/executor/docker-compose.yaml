# ASCAM Executor: runs adaptation plans with status approved (ADR-0020).
# Target addresses come from Knowledge; secrets come from the Docker secrets declared here.
services:
  executor:
    build: {context: ./service}
    image: ascam-executor:dev
    container_name: ascam-executor
    restart: unless-stopped
    environment:
      ASCAM_EXEC_KNOWLEDGE_URL: http://ascam-knowledge-service:8000
      ASCAM_EXEC_TOKEN_FILE: /run/secrets/knowledge_api_tokens
      ASCAM_EXEC_TOKEN_CLIENT: executor
      ASCAM_EXEC_OBDF: bansos
      ASCAM_EXEC_TEIID_PASSWORD_FILE: /run/secrets/obdf_teiid_mgmt_password
      ASCAM_EXEC_AGENT_TOKEN_FILE: /run/secrets/obdf_ontop_agent_token
      # Blue-green OBDA layer (ADR-0022); 'restart' = the older design with a single Ontop
      ASCAM_EXEC_OBDA_STRATEGY: bluegreen
      # alter | recreate (ADR-0023); chosen from the results of feasibility experiment F0.8
      ASCAM_EXEC_VIEW_STATEMENT: ${ASCAM_EXEC_VIEW_STATEMENT:-alter}
      ASCAM_EXEC_TEIID_JDBC_HOST: teiid
      # Observation mode: run with ASCAM_EXEC_ENABLED=false docker-compose up -d
      ASCAM_EXEC_ENABLED: '${ASCAM_EXEC_ENABLED:-true}'
    secrets:
      - knowledge_api_tokens
      - obdf_teiid_mgmt_password
      - obdf_ontop_agent_token
    ports:
      - '127.0.0.1:18300:8000'
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ascam-networks]

secrets:
  knowledge_api_tokens: {file: ../knowledge/secrets/knowledge_api_tokens}
  obdf_teiid_mgmt_password: {file: ../knowledge/secrets/obdf_teiid_mgmt_password}
  obdf_ontop_agent_token: {file: ../knowledge/secrets/obdf_ontop_agent_token}

networks:
  ascam-networks:
    external: true
