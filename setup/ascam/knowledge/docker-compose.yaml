# Komponen Knowledge ASCAM (docs/knowledge/README.md, ADR-0007).
# Jalankan scripts/init-secrets.sh sekali sebelum `docker compose up`.
services:
  knowledge-db:
    image: postgres:16-alpine
    container_name: ascam-knowledge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ascam_owner
      POSTGRES_DB: ascam_knowledge
      POSTGRES_PASSWORD_FILE: /run/secrets/knowledge_db_owner_password
    secrets:
      - knowledge_db_owner_password
      - knowledge_db_app_password
    volumes:
      - knowledge-db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:55432:5432'        # hanya untuk inspeksi lokal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascam_owner -d ascam_knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [ascam-networks]

  knowledge-migrate:
    build: {context: ./service}
    image: ascam-knowledge:dev
    container_name: ascam-knowledge-migrate
    command: ["alembic", "upgrade", "head"]
    depends_on:
      knowledge-db: {condition: service_healthy}
    environment:
      ASCAM_KNOWLEDGE_DB_HOST: knowledge-db
      ASCAM_KNOWLEDGE_DB_NAME: ascam_knowledge
      ASCAM_KNOWLEDGE_DB_USER: ascam_owner
      ASCAM_KNOWLEDGE_DB_PASSWORD_FILE: /run/secrets/knowledge_db_owner_password
    secrets: [knowledge_db_owner_password]
    restart: "no"
    networks: [ascam-networks]

  knowledge-service:
    image: ascam-knowledge:dev
    container_name: ascam-knowledge-service
    restart: unless-stopped
    depends_on:
      knowledge-migrate: {condition: service_completed_successfully}
    environment:
      ASCAM_KNOWLEDGE_DB_HOST: knowledge-db
      ASCAM_KNOWLEDGE_DB_NAME: ascam_knowledge
      ASCAM_KNOWLEDGE_DB_USER: ascam_app                 # role DML saja (D4)
      ASCAM_KNOWLEDGE_DB_PASSWORD_FILE: /run/secrets/knowledge_db_app_password
      ASCAM_KNOWLEDGE_ENCRYPTION_KEYS_FILE: /run/secrets/knowledge_encryption_keys
      ASCAM_KNOWLEDGE_API_TOKENS_FILE: /run/secrets/knowledge_api_tokens
      ASCAM_KNOWLEDGE_BOOTSTRAP_CONFIG: /config/obdf-bansos.yaml
    secrets:
      - knowledge_db_app_password
      - knowledge_encryption_keys
      - knowledge_api_tokens
      - obdf_teiid_mgmt_password
      - obdf_teiid_user_password
    volumes:
      - ./config:/config:ro
    ports:
      - '127.0.0.1:18000:8000'
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ascam-networks]

secrets:
  knowledge_db_owner_password: {file: ./secrets/knowledge_db_owner_password}
  knowledge_db_app_password: {file: ./secrets/knowledge_db_app_password}
  knowledge_encryption_keys: {file: ./secrets/knowledge_encryption_keys}
  knowledge_api_tokens: {file: ./secrets/knowledge_api_tokens}
  obdf_teiid_mgmt_password: {file: ./secrets/obdf_teiid_mgmt_password}
  obdf_teiid_user_password: {file: ./secrets/obdf_teiid_user_password}

volumes:
  knowledge-db-data: {}

networks:
  ascam-networks:
    external: true
