[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ascam-knowledge"
version = "0.1.0"
description = "Komponen Knowledge ASCAM: model runtime OBDF (registry, spec berversi, ops)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3",
    "cryptography>=42",
    "pyyaml>=6",
    "httpx>=0.27",
    "kafka-python-ng>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ascam-knowledge = "ascam_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
