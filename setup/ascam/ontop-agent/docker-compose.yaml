# ASCAM agent on the Ontop host (docs/design-decisions.md, ADR-0011).
# The token is created by setup/ascam/knowledge/scripts/init-secrets.sh (one place for the
# secrets of this laboratory environment).
services:
  ontop-agent:
    build: {context: ./service}
    image: ascam-ontop-agent:dev
    container_name: ascam-ontop-agent
    restart: unless-stopped
    environment:
      ASCAM_AGENT_ARTIFACTS_DIR: /vkg/config
      ASCAM_AGENT_ONTOP_CONTAINER: vkg-system-ontop-teiid
      ASCAM_AGENT_ONTOP_IMAGE: ontop/ontop-endpoint:4.1.1
      ASCAM_AGENT_API_TOKENS_FILE: /run/secrets/ontop_agent_api_tokens
      # Blue-green OBDA layer (ADR-0022). ASCAM_AGENT_ONTOP_CONTAINER above now points to the
      # proxy; validation and start-up use the instances <prefix>-blue / <prefix>-green.
      ASCAM_AGENT_SLOTS_DIR: /vkg/slots
      ASCAM_AGENT_PROXY_RUNTIME_DIR: /vkg/proxy/runtime
      ASCAM_AGENT_PROXY_CONTAINER: vkg-system-ontop-teiid
      ASCAM_AGENT_INSTANCE_PREFIX: vkg-system-ontop
      ASCAM_AGENT_NETWORK: ascam-networks
    secrets: [ontop_agent_api_tokens]
    volumes:
      # OBDA artifacts of the Ontop host. Read-write since F4a: the agent writes ℳ and 𝒯
      # atomically and keeps backups in ../../vkg-system/config/ascam-backups (ADR-0018).
      # Directories of the OBDA layer: config/ (canonical artifacts = active instance), slots/
      # (artifacts per instance), and proxy/runtime/ (nginx upstream).
      - ../../vkg-system:/vkg
      # Needed to run the Ontop CLI once and (F4) to reload Ontop.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '127.0.0.1:18100:8000'
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ascam-networks]

secrets:
  ontop_agent_api_tokens:
    file: ../knowledge/secrets/ontop_agent_api_tokens

networks:
  ascam-networks:
    external: true
