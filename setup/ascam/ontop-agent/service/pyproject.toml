[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ascam-ontop-agent"
version = "0.1.0"
description = "ASCAM agent on the Ontop host: reads, validates, and (since F4) writes the OBDA artifacts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3",
    "docker>=7.1,<8",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ascam-ontop-agent = "ascam_ontop_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
