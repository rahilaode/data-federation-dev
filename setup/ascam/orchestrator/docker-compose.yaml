# ASCAM Orchestrator (Event Normalizer): consumes DDL events from Kafka, normalises them, and
# sends them to Knowledge (docs/design-decisions.md, ADR-0017). The OBDF identity, the topic list,
# and the Kafka address come from Knowledge, so no configuration is duplicated here.
services:
  orchestrator:
    build: {context: ./service}
    image: ascam-orchestrator:dev
    container_name: ascam-orchestrator
    restart: unless-stopped
    environment:
      ASCAM_ORCH_KNOWLEDGE_URL: http://ascam-knowledge-service:8000
      ASCAM_ORCH_TOKEN_FILE: /run/secrets/knowledge_api_tokens
      ASCAM_ORCH_TOKEN_CLIENT: orchestrator
      ASCAM_ORCH_OBDF: bansos
      # restart-ascam.sh gives a new group on every reset and starts from the latest message
      ASCAM_ORCH_GROUP_ID: '${ASCAM_ORCH_GROUP_ID:-ascam-orchestrator}'
      ASCAM_ORCH_OFFSET_RESET: '${ASCAM_ORCH_OFFSET_RESET:-earliest}'
    secrets: [knowledge_api_tokens]
    ports:
      - '127.0.0.1:18200:8000'
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ascam-networks]

secrets:
  knowledge_api_tokens:
    file: ../knowledge/secrets/knowledge_api_tokens

networks:
  ascam-networks:
    external: true
