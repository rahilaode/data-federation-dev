[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ascam-orchestrator"
version = "0.1.0"
description = "Orchestrator ASCAM: konsumsi event DDL dari Kafka, normalisasi, kirim ke Knowledge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3",
    "httpx>=0.27",
    "kafka-python-ng>=2.2",
    "sqlglot>=25",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ascam-orchestrator = "ascam_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
