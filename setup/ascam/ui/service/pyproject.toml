[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ascam-ui"
version = "0.1.0"
description = "Konsol administrator ASCAM (backend-for-frontend + antarmuka web)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "starlette",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ascam-ui = "ascam_ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ascam_ui = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
