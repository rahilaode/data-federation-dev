services:
  teiid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-federation-teiid
    ports:
      - '0.0.0.0:31000:31000'
      - '0.0.0.0:18080:8080'
      - '0.0.0.0:19990:9990'
      - '0.0.0.0:35432:35432'
    networks:
      - ascam-networks
    volumes:
      - teiid-standalone-configuration:/opt/jboss/wildfly/standalone/configuration
      # Konten deployment runtime (VDB versi hasil adaptasi yang di-deploy Executor lewat
      # management API) disimpan WildFly di standalone/data. Tanpa volume ini, konfigurasi yang
      # merujuk deployment tersebut bertahan tetapi kontennya hilang saat kontainer dibuat ulang.
      - teiid-standalone-data:/opt/jboss/wildfly/standalone/data
      - teiid-domain-configuration:/opt/jboss/wildfly/domain/configuration
      # Folder deployment dipakai bersama dengan ASCAM Executor.
      # Berisi government-vdb.xml (Σ_S) beserta marker file scanner
      # (.dodeploy, .isdeploying, .deployed, .failed).
      - ./deployments:/opt/jboss/wildfly/standalone/deployments

networks:
  ascam-networks:
    external: True

volumes:
  teiid-standalone-configuration: { }
  teiid-standalone-data: { }
  teiid-domain-configuration: { }
