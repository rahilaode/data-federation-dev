# Lapisan OBDA dengan blue-green (ADR-0022).
#
#   ontop-proxy   nginx; menempati nama dan port endpoint lama (vkg-system-ontop-teiid:8080),
#                 sehingga Knowledge, harness, dan pengguna tidak perlu diubah
#   ontop-blue    instance Ontop yang membaca slots/blue
#   ontop-green   instance Ontop yang membaca slots/green
#
# Hanya satu instance yang melayani; instance siaga dihentikan oleh start.sh/jalankan.sh dan
# dinyalakan agen ASCAM ketika adaptasi berikutnya disiapkan. Slot dibuat oleh
# init-bluegreen.sh sebelum lapisan ini dinyalakan.
#
# Pengaturan Ontop yang dipertahankan dari rancangan lama:
#   ONTOP_DEV_MODE=false agar urutan Σ'_S -> M' -> T' terkendali oleh ASCAM;
#   init (tini) dan entrypoint yang meng-exec Java agar penghentian berlangsung cepat
#   (docs/adr/0001-reload-ontop.md, entrypoint/README.md).
x-ontop: &ontop
  image: ontop/ontop-endpoint:4.1.1
  restart: unless-stopped
  init: true
  environment:
    ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ontology_file.ttl
    ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.ttl
    ONTOP_PROPERTIES_FILE: /opt/ontop/input/government.docker.properties
    ONTOP_CORS_ALLOWED_ORIGINS: '*'
    ONTOP_DEV_MODE: 'false'
  networks: [ascam-networks]
  entrypoint: ["/opt/wait-for-it/wait-for-it.sh", "teiid:31000", "--timeout=0", "--strict", "--",
               "/opt/ontop/entrypoint.sh"]

services:
  ontop-blue:
    <<: *ontop
    container_name: vkg-system-ontop-blue
    volumes:
      - ./slots/blue:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
      - ./entrypoint/entrypoint-4.1.1-exec.sh:/opt/ontop/entrypoint.sh:ro

  ontop-green:
    <<: *ontop
    container_name: vkg-system-ontop-green
    volumes:
      - ./slots/green:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
      - ./entrypoint/entrypoint-4.1.1-exec.sh:/opt/ontop/entrypoint.sh:ro

  ontop-proxy:
    image: nginx:1.27-alpine
    container_name: vkg-system-ontop-teiid
    restart: unless-stopped
    ports:
      - '0.0.0.0:8080:8080'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/runtime:/etc/nginx/ascam:ro
    networks: [ascam-networks]

networks:
  ascam-networks:
    external: True
