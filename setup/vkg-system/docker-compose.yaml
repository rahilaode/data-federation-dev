services:
  ontop-teiid:
    image: ontop/ontop-endpoint:4.1.1
    container_name: vkg-system-ontop-teiid
    restart: unless-stopped
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ontology_file.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/government.docker.properties
      ONTOP_CORS_ALLOWED_ORIGINS: '*'
      # Dev mode DIMATIKAN: pada dev mode Ontop me-restart dirinya setiap kali
      # berkas konfigurasi berubah, sehingga urutan Σ'_S -> M' -> T' tidak
      # terkendali dan pengukuran Δt_adapt menjadi bias. Reload Ontop
      # dilakukan secara eksplisit oleh ASCAM Executor.
      ONTOP_DEV_MODE: 'false'
    # init (tini) sebagai PID 1 dan entrypoint yang meng-exec java, sehingga
    # SIGTERM sampai ke JVM: kontainer berhenti ~0,8 s (bukan menunggu timeout
    # 10 s lalu SIGKILL) dan shutdown Spring berjalan rapi.
    # Lihat docs/adr/0001-reload-ontop.md
    init: true
    ports:
      - '0.0.0.0:8080:8080'
    networks:
      - ascam-networks
    volumes:
      - ./config:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
      # entrypoint resmi Ontop 4.1.1 dengan satu perubahan: `java` -> `exec java`
      # (backport perilaku entrypoint Ontop 5.0.0). Lihat entrypoint/README.md
      - ./entrypoint/entrypoint-4.1.1-exec.sh:/opt/ontop/entrypoint.sh:ro
    entrypoint: [
        "/opt/wait-for-it/wait-for-it.sh",
        "teiid:31000",
        "--timeout=0",
        "--strict",
        "--",
        "/opt/ontop/entrypoint.sh" ]

networks:
  ascam-networks:
    external: True