# OBDA layer with blue-green deployment (ADR-0022).
#
#   ontop-proxy   nginx; takes the name and port of the old endpoint (vkg-system-ontop-teiid:8080),
#                 so Knowledge, the harness, and users need no change
#   ontop-blue    Ontop instance that reads slots/blue
#   ontop-green   Ontop instance that reads slots/green
#
# Only one instance serves; the standby instance is stopped by start.sh/restart-ascam.sh and
# started by the ASCAM agent when the next adaptation is prepared. The slots are created by
# init-bluegreen.sh before this layer is started.
#
# Ontop settings kept from the earlier design:
#   ONTOP_DEV_MODE=false so that the order Σ'_S -> M' -> T' is controlled by ASCAM;
#   init (tini) and an entrypoint that execs Java, so that shutdown is fast
#   (ADR-0001 in docs/design-decisions.md, entrypoint/README.md).
x-ontop: &ontop
  image: ontop/ontop-endpoint:4.1.1
  restart: unless-stopped
  init: true
  environment:
    ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ontology_file.ttl
    ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.ttl
    ONTOP_PROPERTIES_FILE: /opt/ontop/input/government.docker.properties
    ONTOP_CORS_ALLOWED_ORIGINS: '*'
    ONTOP_DEV_MODE: 'false'
  networks: [ascam-networks]
  entrypoint: ["/opt/wait-for-it/wait-for-it.sh", "teiid:31000", "--timeout=0", "--strict", "--",
               "/opt/ontop/entrypoint.sh"]

services:
  ontop-blue:
    <<: *ontop
    container_name: vkg-system-ontop-blue
    volumes:
      - ./slots/blue:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
      - ./entrypoint/entrypoint-4.1.1-exec.sh:/opt/ontop/entrypoint.sh:ro

  ontop-green:
    <<: *ontop
    container_name: vkg-system-ontop-green
    volumes:
      - ./slots/green:/opt/ontop/input
      - ./jdbc:/opt/ontop/jdbc
      - ./wait-for-it:/opt/wait-for-it
      - ./entrypoint/entrypoint-4.1.1-exec.sh:/opt/ontop/entrypoint.sh:ro

  ontop-proxy:
    image: nginx:1.27-alpine
    container_name: vkg-system-ontop-teiid
    restart: unless-stopped
    ports:
      - '0.0.0.0:8080:8080'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/runtime:/etc/nginx/ascam:ro
    networks: [ascam-networks]

networks:
  ascam-networks:
    external: True
