# Proxy endpoint SPARQL untuk blue-green lapisan OBDA (ADR-0022).
# Upstream aktif ditulis agen ASCAM ke /etc/nginx/ascam/upstream.conf; peralihan dilakukan dengan
# `nginx -s reload`, yang membiarkan worker lama menyelesaikan permintaan yang sedang berjalan.
worker_processes 1;
events { worker_connections 256; }

http {
    # DNS Docker; nama instance di-resolve saat permintaan, sehingga nginx tetap menyala
    # walaupun instance siaga sedang berhenti.
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log off;

    server {
        listen 8080;
        include /etc/nginx/ascam/upstream.conf;     # set $ontop_upstream http://...:8080;

        location / {
            proxy_pass $ontop_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            client_max_body_size 10m;
        }
    }
}
