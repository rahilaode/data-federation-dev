# SPARQL endpoint proxy for the blue-green OBDA layer (ADR-0022).
# The ASCAM agent writes the active upstream to /etc/nginx/ascam/upstream.conf; the switch is a
# `nginx -s reload`, which lets the old workers finish the requests already in progress.
worker_processes 1;
events { worker_connections 256; }

http {
    # Docker DNS; instance names are resolved per request, so nginx stays up even while the
    # standby instance is stopped.
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log off;

    server {
        listen 8080;
        include /etc/nginx/ascam/upstream.conf;     # set $ontop_upstream http://...:8080;

        location / {
            proxy_pass $ontop_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            client_max_body_size 10m;
        }
    }
}
